<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codex подключён</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #f8fafc;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: radial-gradient(ellipse at top left, #364b9a, transparent 55%),
                  linear-gradient(135deg, #101827, #17142c 65%, #25183a);
    }
    main {
      width: min(100%, 680px);
      padding: clamp(32px, 7vw, 64px);
      text-align: center;
      border: 1px solid rgb(255 255 255 / 14%);
      border-radius: 28px;
      background: rgb(255 255 255 / 7%);
      box-shadow: 0 24px 80px rgb(0 0 0 / 30%);
      backdrop-filter: blur(14px);
    }
    .badge {
      display: inline-block;
      margin-bottom: 22px;
      padding: 7px 13px;
      border: 1px solid rgb(167 243 208 / 30%);
      border-radius: 999px;
      color: #a7f3d0;
      background: rgb(16 185 129 / 12%);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-size: clamp(28px, 6vw, 46px); line-height: 1.15; letter-spacing: -.04em; }
    p { margin: 18px 0 0; color: #c5ccdc; font-size: 16px; line-height: 1.7; }
  </style>
</head>
<body>
  <main>
    <span class="badge">Подключение активно</span>
    <h1>Codex успешно подключён к проекту DROP-ME-FAIL</h1>
    <p>Тестовая страница создана и готова к просмотру.</p>
  </main>
</body>
</html>
